version: '3.8'

services:
  # NOTE (dev-review variant, see TASK.md — Dockerize for Frictionless
  # Reviewer Handoff): the local `db` (Postgres) service that used to be
  # here has been deliberately dropped. orm_collection/.env's
  # DATABASE_URL override already points every backend-family service at
  # the live Render Postgres — nothing in the app ever queried this local
  # container, so it only cost reviewer wait time via depends_on/healthcheck.
  # If you need a real local Postgres again (e.g. offline dev, not
  # pointed at Render), re-add it and the matching depends_on entries.
  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./orm_collection
    image: orm-platform-backend:dev-review
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Local dev/review runs the frontend and backend over plain HTTP --
      # browsers refuse to send a Secure cookie over HTTP, so the session
      # cookie (core/security.py) would silently never reach the backend.
      # Override to true (or unset) for any real HTTPS deployment.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      # This is the ONLY process serving real dashboard traffic directly
      # (single uvicorn process, no --workers), so it gets the largest
      # individual allocation -- see db.py / 2026-09-02/03 investigation.
      # TEMPORARY DEV-ONLY OVERRIDE (2026-09-04): pool_size halved 8->4 to
      # relieve DB connection-slot exhaustion confirmed live tonight
      # (managed Postgres refusing new connections, "remaining connection
      # slots are reserved for roles with the SUPERUSER attribute"). This
      # does NOT replace the 8/4 sizing decided above -- restore it if this
      # environment's DB plan connection limit is ever raised, or if this
      # config gets promoted to a real production target.
      - DB_POOL_SIZE=4
      - DB_MAX_OVERFLOW=4
    volumes:
      # database/ lives at the repo root, outside this service's build
      # context (./orm_collection) -- bind-mounted read-only so
      # bootstrap_schema.py can apply schema.sql on first boot without
      # duplicating the file into the image. See TASK.md (Remove Alembic).
      - ./database:/app/database:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # celery-worker-general was split into celery-worker-io, celery-worker-cpu,
  # celery-worker-nlp, and celery-worker-aggregation below. It ran all four
  # queues (io/cpu/nlp/aggregation) in one --pool=solo --concurrency=1
  # process, so a slow NLP inference call blocked feed collection and vice
  # versa -- see forensic audit §5/§11. Each queue now gets its own process.
  celery-worker-io:
    image: orm-platform-backend:dev-review
    restart: unless-stopped
    mem_limit: 1.5g
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # CELERY_SKIP_MATCHING_ENGINE was removed here: pipeline_stage_collect
      # (aggregation_tasks.py, queue="io_queue") calls process_and_save_document
      # -> engine_instance.process_document, so this worker DOES need the
      # matching engine loaded and pubsub-refreshed. Skipping it left the
      # engine frozen at container-startup keywords forever (no pubsub
      # listener == never hears keyword_updated), silently producing zero
      # DocumentMatch rows for any client onboarded after this container's
      # last restart -- confirmed live for Godrej Properties (2026-09-02).
      # This queue is I/O-bound (external feed/search fetches, watchdogs) --
      # it has the most processes (concurrency=4 below) of any service but
      # barely touches the DB, so it gets the smallest per-process pool.
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    volumes:
      # app.workers.backup_tasks.run_backup (Section 10) is routed to
      # io_queue and writes its pg_dump output here. Named volume, not a
      # bind mount -- offsite/cloud replication of this volume's contents
      # is a follow-up, not done here (see docs/BACKUP.md).
      - backup_data:/backups
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # I/O-bound (feed fetches, search calls) -- threads/greenlets aren't
    # available without extra deps, so prefork concurrency=4 is a
    # conservative default to get overlap on network-wait-bound tasks
    # without assuming a particular core count.
    command: ["python", "-m", "celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--hostname=io@%h", "--pool=prefork", "--concurrency=4", "-Q", "io_queue"]
    healthcheck:
      # Mirrors backend's healthcheck: ["CMD", "curl", "-f", ...]. Uses
      # CMD-SHELL (not CMD) because it needs shell command substitution to
      # target this container's own worker (`io@$(hostname)`) --
      # `inspect ping` with no destination replies from every worker
      # reachable via the shared Redis broker, which would report this
      # container healthy even if this worker specifically had died.
      test: ["CMD-SHELL", "python -m celery -A app.core.celery_app.celery_app inspect ping -d io@$(hostname) --timeout 10 | grep -q OK"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 40s

  celery-worker-cpu:
    image: orm-platform-backend:dev-review
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # TEMPORARY DEV-ONLY OVERRIDE (2026-09-04): pool_size halved 2->1 to
      # relieve DB connection-slot exhaustion confirmed live tonight --
      # see the matching note on the backend service above. Not a change
      # to real production sizing.
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # CPU-bound entity matching -- concurrency=2 leaves headroom alongside
    # the other worker processes on a single host rather than saturating it.
    command: ["python", "-m", "celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--hostname=cpu@%h", "--pool=prefork", "--concurrency=2", "-Q", "cpu_queue"]
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A app.core.celery_app.celery_app inspect ping -d cpu@$(hostname) --timeout 10 | grep -q OK"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 40s

  celery-worker-nlp:
    image: orm-platform-backend:dev-review
    restart: unless-stopped
    mem_limit: 6g
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Constrain each process's own BLAS/OMP intra-op thread count.
      # docker-compose.yml (this file) is what the DigitalOcean droplet
      # actually runs -- copilot/ was generated but never deployed
      # (docs/AWS_DEPLOYMENT.md: "Nothing in this doc has been run"), so
      # it is not a real second production target. Verified live
      # (forensic-audit fixes round) that on a CPU-constrained host,
      # concurrent transformer-inference processes without this default
      # to using every visible core each and thrash each other -- ~110s/
      # document vs ~4-13s/document unconstrained-concurrency=3 on a
      # 2-vCPU budget, a 10-27x regression. Required now that concurrency
      # is >1 below -- without these pins each of the 3 prefork processes
      # would try to use every visible core and thrash the other two.
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      # TEMPORARY DEV-ONLY OVERRIDE (2026-09-04): pool_size halved 2->1 to
      # relieve DB connection-slot exhaustion confirmed live tonight --
      # see the matching note on the backend service above. Not a change
      # to real production sizing.
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Sentiment/topic transformer models: measured at ~1.9GB RSS for a
    # single worker process at steady state (docs/AWS_DEPLOYMENT.md
    # Section 6, orm_collection/scripts/profile_nlp_memory.py). Concurrency
    # raised from 1 to 3 (with --pool switched solo -> prefork, since solo
    # only ever runs one process regardless of --concurrency) after live
    # verification directly against this real Droplet, not the earlier
    # local test's assumed budget:
    #   - `nproc` inside this container: 2 (matches the Droplet's real 2
    #     vCPUs, no cgroup CPU limit imposed -- same budget the local test
    #     that measured the ~31% throughput gain was run against).
    #   - `free -h` on the Droplet: 15Gi total, 9.7Gi available at the time
    #     of testing, well beyond what a raised mem_limit here needs.
    #   - Real 3-concurrent-process peak RSS, measured via a throwaway
    #     --entrypoint sleep container from this same image (7g cap, same
    #     OMP/MKL/TOKENIZERS pins, no DB/Redis/client-data access --
    #     scripts/profile_nlp_memory.py is self-contained) running 3
    #     parallel `profile_nlp_memory.py` processes and sampling `docker
    #     stats` every 5s: peaked and plateaued at 3.55GiB combined --
    #     lower than the naive ~1.9GB x 3 = 5.7GB estimate, not higher.
    # mem_limit raised 4g -> 6g accordingly: real measured peak (3.55GiB)
    # plus a real margin, not the bare 4g the peak would have barely fit
    # under. NOTE: this file IS what runs on the real droplet (see above)
    # -- the copilot/celery-worker-nlp/manifest.yml concurrency=3 sizing
    # referenced here in earlier revisions was never-deployed planning
    # config, not a live second environment; don't treat it as "what
    # production actually runs" without confirming it's been deployed.
    command: ["python", "-m", "celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--hostname=nlp@%h", "--pool=prefork", "--concurrency=3", "-Q", "nlp_queue"]
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A app.core.celery_app.celery_app inspect ping -d nlp@$(hostname) --timeout 10 | grep -q OK"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 40s

  celery-worker-aggregation:
    image: orm-platform-backend:dev-review
    restart: unless-stopped
    mem_limit: 1.5g
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # TEMPORARY DEV-ONLY OVERRIDE (2026-09-04): pool_size halved 2->1 to
      # relieve DB connection-slot exhaustion confirmed live tonight --
      # see the matching note on the backend service above. Not a change
      # to real production sizing.
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Hourly trend/risk/alert/narrative/reputation aggregation across all
    # clients -- concurrency=2 for the same headroom reasoning as cpu_queue.
    command: ["python", "-m", "celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--hostname=aggregation@%h", "--pool=prefork", "--concurrency=2", "-Q", "aggregation_queue"]
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A app.core.celery_app.celery_app inspect ping -d aggregation@$(hostname) --timeout 10 | grep -q OK"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 40s

  celery-worker-pipeline:
    image: orm-platform-backend:dev-review
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--hostname=pipeline@%h", "--pool=solo", "--concurrency=1", "-Q", "pipeline_queue"]
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A app.core.celery_app.celery_app inspect ping -d pipeline@$(hostname) --timeout 10 | grep -q OK"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 40s

  celery-beat:
    image: orm-platform-backend:dev-review
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # beat_schedule (celery_app.py) is defined in Python and dispatch is
      # a pure Redis publish -- beat itself does not query the app DB in
      # normal operation, so this is effectively unused headroom, not a
      # real allocation.
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    healthcheck:
      # celery-beat has no worker to `inspect ping` -- it schedules, it
      # doesn't consume. Its beat_schedule (app/core/celery_app.py) has
      # multiple per-minute crontabs, and beat rewrites its persistent
      # schedule file (celerybeat-schedule, default location, in WORKDIR
      # /app per the Dockerfile) on every wakeup, so a live process
      # touches this file at least once a minute. A stale mtime means the
      # scheduler loop has stopped ticking.
      test: ["CMD-SHELL", "find /app/celerybeat-schedule* -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./orm_dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: orm-platform-frontend:dev-review
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  backup_data:
