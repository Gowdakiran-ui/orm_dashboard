# Environment-level Copilot addon: the S3 bucket for offsite pg_dump
# backups (extends app/workers/backup_tasks.py -- see docs/BACKUP.md) and
# for ENABLE_S3_STORAGE document storage (app/core/s3_client.py,
# app/utils/s3_client.py).
#
# Bucket policy access is granted via the IAM::ManagedPolicy resource below,
# which Copilot auto-attaches to every service's task role in this
# environment -- no per-service wiring needed. The app's S3 client still
# authenticates with explicit S3_ACCESS_KEY/S3_SECRET_KEY (not the task
# role's implicit credentials -- see app/core/s3_client.py, which passes
# aws_access_key_id/aws_secret_access_key explicitly for MinIO
# compatibility), so those two values are a separate IAM user's static keys,
# supplied via `copilot secret init` -- not generated by this template.
Parameters:
  App:
    Type: String
    Description: Your application's name.
  Env:
    Type: String
    Description: The environment name your service, job, or workflow is being deployed to.
  Name:
    Type: String
    Default: orm-platform
    Description: The name of the service, job, or workflow being deployed.

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldBackupDumps
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 30

  BucketAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub 'Grants read/write access to the ${App}-${Env} S3 bucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${BackupBucket.Arn}/*'
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt BackupBucket.Arn

Outputs:
  BackupBucketName:
    Description: S3 bucket name (plain, non-secret -- consumed via `variables:`)
    Value: !Ref BackupBucket
