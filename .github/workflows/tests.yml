name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Throwaway Postgres (same major as production, 18) for the schema/write-path
    # check below. Local to this job only; nothing here touches a real database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: orm_collection/requirements.txt

      - name: Install backend dependencies
        run: pip install -r orm_collection/requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest
        run: pytest orm_collection/tests -v

      # Builds the schema from database/schema.sql + database/migrations/*.sql in a
      # real Postgres and runs the reputation / executive / benchmark engines
      # (INSERT and ON CONFLICT upsert). The unit tests use SQLite built from the ORM
      # models and cannot catch a NOT NULL / CHECK mismatch with the real schema.
      - name: Verify engine write paths against a real Postgres
        run: python scripts/verify_schema_write_paths.py --url postgresql://postgres:postgres@127.0.0.1:5432/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orm_dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 is EOL and GitHub-hosted runners now silently execute
          # setup-node@v4's Node-20 actions on a Node 24 shim regardless of
          # what this pins (see the runner's own deprecation warning in the
          # job log). jsdom@30's vendored undici breaks under that Node 24
          # shim (`webidl.util.markAsUncloneable is not a function`) --
          # jsdom is already at its latest release, so there is no newer
          # version to bump to. Pinning an actively-supported LTS instead
          # of the deprecated one avoids the silent runner override and its
          # incompatibility; verified locally on Node 22.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: orm_dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
