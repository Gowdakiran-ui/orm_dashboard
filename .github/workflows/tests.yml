name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: orm_collection/requirements.txt

      - name: Install backend dependencies
        run: pip install -r orm_collection/requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest
        run: pytest orm_collection/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orm_dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: orm_dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test
